short_bio: >-
  <p>
    I am a Postdoctoral Researcher with the
    <a href="https://mmlab.ie.cuhk.edu.hk/" target="_blank" rel="noopener">Multimedia Lab</a>
    at The Chinese University of Hong Kong and the
    <a href="https://www.cpii.hk/" target="_blank" rel="noopener">Centre for Perceptual and Interactive Intelligence (CPII)</a>,
    working with Prof. Hongsheng Li. I received my Ph.D. in Computer Science from
    <a href="https://www.hku.hk/" target="_blank" rel="noopener">The University of Hong Kong</a>
    in 2025, where I was supervised by Prof. Yizhou Yu (ACM &amp; IEEE Fellow) and Prof. Guanbin Li.
  </p>
  <p>
    My research focuses on embodied AI and visual intelligence, including robotic manipulation,
    vision-language navigation, vision-language-action models, and data-efficient learning.
  </p>
  <p>
    I welcome opportunities for academic collaboration and professional engagement. Please feel free to reach out
    if you would like to discuss potential collaborations or opportunities.
  </p>

