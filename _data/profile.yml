short_bio: >-
  <p>
    I am a fourth-year Ph.D. student in the Department of Computer Science at
    <a href="https://www.hku.hk/" target="_blank" rel="noopener">The University of Hong Kong</a>,
    supervised by Prof. Yizhou Yu (ACM &amp; IEEE Fellow).
  </p>
  <p>
    Before that, I received both my B.Eng. and M.Eng. degrees from
    <a href="https://www.sysu.edu.cn/sysuen/" target="_blank" rel="noopener">Sun Yat-sen University</a>,
    where I was advised by Prof. Guanbin Li. My research interests include weakly supervised learning,
    dataset condensation, and embodied AI.
  </p>

